name: Mobile

# Builds the Android APK and an unsigned iOS simulator build through Capacitor.
#
# WHY THE NATIVE SHELLS ARE GENERATED AT RUNTIME
# ----------------------------------------------
# android/ and ios/ are NOT committed to this repository, and could not be
# generated in the environment where this file was written: the Android SDK host
# (dl.google.com) is unreachable there, and iOS needs macOS + Xcode. So this
# workflow bootstraps the shells on the runner instead, where both exist.
#
# IOS USES SWIFT PACKAGE MANAGER, NOT COCOAPODS
# ---------------------------------------------
# Since Capacitor 8 the iOS template resolves dependencies through SPM, which is
# built into Xcode. `cap add ios` therefore creates ios/App/App.xcodeproj and a
# generated ios/App/CapApp-SPM package -- and no Podfile and no App.xcworkspace,
# since the workspace only ever existed as a CocoaPods artifact. That is why
# there is no `pod install` step and why the build targets -project.
#
# WHY IT ALSO TRIGGERS ON pull_request
# ------------------------------------
# `workflow_dispatch` only works once the workflow file exists on the default
# branch -- GitHub 404s on the dispatch endpoint until then. `pull_request`
# workflows are resolved from the PR HEAD branch instead, so that trigger is
# what makes this executable from an unmerged branch. No merge to main required.
#
# WHAT THIS GIVES YOU
# -------------------
# You have no Mac. GitHub's macOS runners are the substitute: this workflow is
# the only way CarTrack reaches iOS. It produces an UNSIGNED simulator build,
# which is enough to prove the port compiles and runs. Shipping to the App
# Store additionally needs an Apple Developer account (USD 99/yr) and signing
# secrets -- see "Adding real signing" at the bottom.
#
# FIRST RUN IS EXPECTED TO BE SLOW and may need fixes. Treat it as a porting
# task, not a push-button.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which platform to build"
        type: choice
        default: both
        options: [android, ios, both]
  # Also runs on pull requests. This is what makes the workflow executable at
  # all while the branch is unmerged: GitHub resolves `pull_request` workflows
  # from the PR HEAD branch, whereas `workflow_dispatch` requires the file to
  # exist on the default branch and 404s otherwise.
  #
  # The paths filter is NOT a per-commit filter. For `pull_request` GitHub
  # evaluates it against the cumulative PR diff (base...head), so once the PR
  # touches any path below, EVERY later push to that branch retriggers this
  # workflow -- including docs-only commits. Verified: a commit changing only
  # README.md produced a Mobile run because the PR diff matched 18 paths.
  # The filter keeps the workflow off unrelated PRs; it does not make pushes to
  # this PR cheap. The concurrency block below is what actually bounds the
  # macOS spend.
  pull_request:
    paths:
      - ".github/workflows/mobile.yml"
      - "src/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

# Without this, a macOS run already in flight keeps running after a newer push
# supersedes it, and its minutes are still billed. macOS runners are the
# expensive ones here, so cancelling superseded runs matters more than on the
# Linux legs of ci.yml. `cancel-in-progress` cannot abort a queued macOS job
# that has not started, but it does stop one that is already building.
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  web:
    name: Build web assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web-dist
          path: dist
          if-no-files-found: error

  android:
    name: Android APK (debug)
    # On a workflow_dispatch run, honour the chosen target. On any other event
    # (pull_request) `inputs.target` is null, so without this first clause both
    # jobs would silently skip and the run would report a misleading success.
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'android' || inputs.target == 'both'
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4.0.4

      - name: Restore web assets
        uses: actions/download-artifact@v8.0.2
        with:
          name: web-dist
          path: dist

      # Capacitor is installed here rather than added to package.json so the
      # project does not carry a dependency nothing imports yet.
      - name: Bootstrap Capacitor
        run: |
          set -euo pipefail
          npm install --no-save @capacitor/cli@^8 @capacitor/core@^8 @capacitor/android@^8
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            cat > capacitor.config.json <<'JSON'
          {
            "appId": "dev.cartrack.app",
            "appName": "CarTrack",
            "webDir": "dist"
          }
          JSON
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cartrack-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS simulator build (unsigned)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'ios' || inputs.target == 'both'
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Restore web assets
        uses: actions/download-artifact@v8.0.2
        with:
          name: web-dist
          path: dist

      - name: Bootstrap Capacitor
        run: |
          set -uo pipefail
          npm install --no-save @capacitor/cli@^8 @capacitor/core@^8 @capacitor/ios@^8

          echo "--- installed @capacitor packages ---"
          ls -1 node_modules/@capacitor 2>/dev/null || echo "(none)"
          echo "--- cap CLI version ---"
          npx cap --version 2>&1 || echo "cap CLI unavailable"

          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            cat > capacitor.config.json <<'JSON'
          {
            "appId": "dev.cartrack.app",
            "appName": "CarTrack",
            "webDir": "dist"
          }
          JSON
          fi
          echo "--- capacitor config ---"
          cat capacitor.config.json 2>/dev/null || cat capacitor.config.ts 2>/dev/null || echo "(NO CONFIG)"
          echo "--- webDir (dist) ---"
          ls -la dist 2>/dev/null | head -6 || echo "(dist MISSING)"

          if [ ! -d ios ]; then
            echo "--- running: npx cap add ios ---"
            npx cap add ios 2>&1 | tee /tmp/capadd.log
            echo "cap add ios exit: ${PIPESTATUS[0]}"
          else
            echo "--- ios/ already present, skipping cap add ---"
          fi

          echo "--- ios tree (depth 3) ---"
          find ios -maxdepth 3 2>/dev/null | head -40 || echo "(NO ios DIRECTORY)"

          # Capacitor 8 scaffolds iOS with Swift Package Manager, not
          # CocoaPods: there is no Podfile and no App.xcworkspace, and
          # plugin dependencies live in ios/App/CapApp-SPM instead. Assert on
          # the Xcode project, which is what the build step actually needs, and
          # report the evidence through annotations since the log archive is
          # unreachable from here.
          if [ ! -d ios/App/App.xcodeproj ]; then
            echo "::error title=bootstrap::ios/App/App.xcodeproj was not created by cap add ios"
            tail -n 30 /tmp/capadd.log 2>/dev/null | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=cap add ios::${line}"
            done
            find ios -maxdepth 3 2>/dev/null | head -20 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=ios tree::${line}"
            done
            exit 1
          fi

          echo "--- SPM package manifest ---"
          ls -la ios/App/CapApp-SPM 2>/dev/null || echo "(no CapApp-SPM directory)"

          npx cap sync ios

      # Diagnostics exist because the runner's own logs may not be reachable
      # from wherever this is being debugged. Everything printed here is cheap,
      # and the ::error:: annotations below are readable through the GitHub API
      # even when the log archive is not.
      - name: Runner diagnostics
        run: |
          set -uo pipefail
          echo "macOS:     $(sw_vers -productVersion 2>/dev/null || echo unknown)"
          echo "arch:      $(uname -m)"
          echo "ruby:      $(ruby -v 2>&1 | head -1 || echo absent)"
          echo "gem:       $(gem --version 2>&1 | head -1 || echo absent)"
          echo "pod:       $(pod --version 2>&1 | head -1 || echo ABSENT)"
          echo "brew:      $(brew --version 2>&1 | head -1 || echo absent)"
          echo "xcodebuild: $(xcodebuild -version 2>&1 | head -2 | tr '\n' ' ' || echo absent)"

      # CocoaPods is deliberately absent here. Capacitor 8 resolves iOS
      # dependencies through Swift Package Manager, which is built into Xcode,
      # so there is no Podfile to install and no Ruby toolchain to provision.
      # Re-add CocoaPods only if the project passes
      # `--packagemanager CocoaPods` to `cap add ios`.

      # Unsigned, simulator-only. This proves the port builds. It cannot be
      # installed on a device or uploaded to App Store Connect.
      #
      # -project, not -workspace: an SPM project has no .xcworkspace, because
      # the workspace is an artifact of CocoaPods. Building App.xcodeproj lets
      # xcodebuild resolve CapApp-SPM itself.
      - name: Build for simulator
        working-directory: ios/App
        run: |
          set -uo pipefail
          if xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/xcode.log; then
            exit 0
          fi
          grep -E "error:|fatal error|The following build commands failed" /tmp/xcode.log \
            | tail -n 25 \
            | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error title=xcodebuild::${line}"
              done
          exit 1

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cartrack-ios-simulator
          path: ios/App/build/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error

# ADDING REAL SIGNING
# -------------------
# 1. Join the Apple Developer Program (USD 99/yr). Unavoidable.
# 2. Store in repository secrets: an distribution .p12 as IOS_CERT_B64, its
#    password as IOS_CERT_PASSWORD, and the provisioning profile as
#    IOS_PROFILE_B64.
# 3. Decode them into the keychain before the build step, drop
#    CODE_SIGNING_ALLOWED=NO, and target 'generic/platform=iOS'.
# 4. Upload with `xcrun altool` or the Transporter app.
#
# Android release signing is simpler: generate a keystore, store it as a secret,
# and switch `assembleDebug` to `bundleRelease`.
